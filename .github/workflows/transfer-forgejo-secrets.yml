name: Transfer signing secrets to Forgejo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transfer-forgejo-secrets.yml

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Forgejo token and transfer repository secrets
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          root = "https://git.mandocloud.uk"
          repo = root + "/api/v1/repos/Mr.Ares/proxmox-mobile-manager"
          token = os.environ.get("FORGEJO_TOKEN", "")
          if not token:
              raise SystemExit("Missing GitHub secret FORGEJO_TOKEN.")

          headers = {
              "Authorization": "token " + token,
              "Accept": "application/json",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, body
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace").replace(token, "[REDACTED]")
                  print("Forgejo API error:", exc.code, detail[:1000])
                  raise SystemExit("Forgejo API request failed; see safe diagnostic above.") from None

          status, body = request(root + "/api/v1/user")
          user = json.loads(body)
          print("Token authenticates as Forgejo user:", user.get("login", "(login field absent)"))

          status, body = request(repo)
          repository = json.loads(body)
          print("Repository access reported by Forgejo:", json.dumps(repository.get("permissions", {}), sort_keys=True))

          values = {
              "ANDROID_KEYSTORE_BASE64": os.environ.get("KEYSTORE_BASE64", ""),
              "ANDROID_KEYSTORE_PASSWORD": os.environ.get("KEYSTORE_PASSWORD", ""),
              "ANDROID_KEY_ALIAS": os.environ.get("KEY_ALIAS", ""),
              "ANDROID_KEY_PASSWORD": os.environ.get("KEY_PASSWORD", ""),
              "UPDATE_REPO_TOKEN": token,
          }
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit("Required GitHub secrets are missing: " + ", ".join(missing) + ". No transfer completed.")

          for name, value in values.items():
              status, _ = request(repo + "/actions/secrets/" + name, "PUT", {"data": value})
              if status not in (201, 204):
                  raise SystemExit("Forgejo did not accept secret " + name + " (HTTP " + str(status) + ").")
              print("Transferred secret:", name)

          print("All five secrets were transferred to Forgejo.")
          PY
