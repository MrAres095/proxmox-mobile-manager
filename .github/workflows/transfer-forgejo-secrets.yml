name: Transfer signing secrets to Forgejo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install encryption dependency
        run: python -m pip install --quiet pynacl

      - name: Transfer encrypted repository secrets
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from nacl.public import PublicKey, SealedBox

          base = "https://git.mandocloud.uk/api/v1/repos/Mr.Ares/proxmox-mobile-manager/actions/secrets"
          token = os.environ.get("FORGEJO_TOKEN", "")
          if not token:
              raise SystemExit("Missing GitHub secret FORGEJO_TOKEN.")

          values = {
              "ANDROID_KEYSTORE_BASE64": os.environ.get("KEYSTORE_BASE64", ""),
              "ANDROID_KEYSTORE_PASSWORD": os.environ.get("KEYSTORE_PASSWORD", ""),
              "ANDROID_KEY_ALIAS": os.environ.get("KEY_ALIAS", ""),
              "ANDROID_KEY_PASSWORD": os.environ.get("KEY_PASSWORD", ""),
              "UPDATE_REPO_TOKEN": token,
          }
          if any(not value for value in values.values()):
              raise SystemExit("One or more required GitHub secrets are missing; no transfer completed.")

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "token " + token,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("Forgejo API request failed with HTTP " + str(exc.code)) from None

          _, key_data = request(base + "/public-key")
          public_key = PublicKey(base64.b64decode(key_data["key"]))
          key_id = key_data["key_id"]
          box = SealedBox(public_key)

          for name, value in values.items():
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              request(base + "/" + name, "PUT", {
                  "encrypted_value": encrypted,
                  "key_id": key_id,
              })
              print("Transferred encrypted secret: " + name)

          print("All five secrets were transferred to Forgejo.")
          PY
