name: Transfer signing secrets to Forgejo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transfer-forgejo-secrets.yml

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer repository secrets through Forgejo's Actions API
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://git.mandocloud.uk/api/v1/repos/Mr.Ares/proxmox-mobile-manager/actions/secrets"
          token = os.environ.get("FORGEJO_TOKEN", "")
          if not token:
              raise SystemExit("Missing GitHub secret FORGEJO_TOKEN.")

          values = {
              "ANDROID_KEYSTORE_BASE64": os.environ.get("KEYSTORE_BASE64", ""),
              "ANDROID_KEYSTORE_PASSWORD": os.environ.get("KEYSTORE_PASSWORD", ""),
              "ANDROID_KEY_ALIAS": os.environ.get("KEY_ALIAS", ""),
              "ANDROID_KEY_PASSWORD": os.environ.get("KEY_PASSWORD", ""),
              "UPDATE_REPO_TOKEN": token,
          }
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit("Required GitHub secrets are missing: " + ", ".join(missing) + ". No transfer completed.")

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": "token " + token,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("Forgejo API request failed with HTTP " + str(exc.code)) from None

          for name, value in values.items():
              status, _ = request(base + "/" + name, "PUT", {"data": value})
              if status not in (201, 204):
                  raise SystemExit("Forgejo did not accept secret " + name + " (HTTP " + str(status) + ").")
              print("Transferred secret: " + name)

          print("All five secrets were transferred to Forgejo.")
          PY
