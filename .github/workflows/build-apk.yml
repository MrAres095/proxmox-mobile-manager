name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/proxmox-release.jks
          chmod 600 app/proxmox-release.jks
          test -s app/proxmox-release.jks

      - name: Diagnose keystore secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e

          echo "=== Secret presence ==="
          [ -n "$KEYSTORE_PASSWORD" ] && echo "KEYSTORE_PASSWORD: PRESENT" || echo "KEYSTORE_PASSWORD: MISSING"
          [ -n "$KEY_PASSWORD" ] && echo "KEY_PASSWORD: PRESENT" || echo "KEY_PASSWORD: MISSING"
          [ -n "$KEY_ALIAS" ] && echo "KEY_ALIAS: PRESENT" || echo "KEY_ALIAS: MISSING"
          echo "KEY_ALIAS value: $KEY_ALIAS"

          echo
          echo "=== Keystore password test ==="
          keytool -list -keystore app/proxmox-release.jks -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1
          STORE_RESULT=$?
          [ $STORE_RESULT -eq 0 ] && echo "KEYSTORE_PASSWORD: OK" || echo "KEYSTORE_PASSWORD: FAILED"

          echo
          echo "=== Private-key password test ==="
          keytool -list -keystore app/proxmox-release.jks -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1
          KEY_RESULT=$?
          [ $KEY_RESULT -eq 0 ] && echo "KEY_PASSWORD: OK" || echo "KEY_PASSWORD: FAILED"

          echo
          echo "=== Final diagnosis ==="
          if [ $STORE_RESULT -ne 0 ]; then
            echo "DIAGNOSIS: KEYSTORE_PASSWORD does not unlock the keystore, or KEY_ALIAS is wrong."
            exit 1
          fi
          if [ $KEY_RESULT -ne 0 ]; then
            echo "DIAGNOSIS: KEY_PASSWORD does not unlock the private key."
            exit 1
          fi
          echo "DIAGNOSIS: All keystore secrets are valid."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease -PAPP_VERSION_CODE="${{ github.run_number }}" -PAPP_VERSION_NAME="0.1.${{ github.run_number }}" --no-daemon

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk proxmox-mobile-manager.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" proxmox-mobile-manager.apk --title "Proxmox Mobile Manager $TAG_NAME" --generate-notes
