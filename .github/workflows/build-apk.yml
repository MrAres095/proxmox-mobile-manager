name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/proxmox-release.jks
          chmod 600 app/proxmox-release.jks
          test -s app/proxmox-release.jks

      - name: Validate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED_SHA256="EF:1A:D5:DE:68:28:CB:09:37:C7:5B:95:EB:B8:DE:00:5D:C7:57:86:C7:A1:D0:65:44:AE:13:1C:3B:05:14:66"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          keytool -list -keystore app/proxmox-release.jks -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -v > /tmp/keystore.txt
          grep -Fq "Alias name: $KEY_ALIAS" /tmp/keystore.txt
          grep -A2 -B1 -F "Alias name: $KEY_ALIAS" /tmp/keystore.txt | grep -Fq "PrivateKeyEntry"
          grep -Fq "SHA256: $EXPECTED_SHA256" /tmp/keystore.txt

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease -PAPP_VERSION_CODE="${{ github.run_number }}" -PAPP_VERSION_NAME="0.1.${{ github.run_number }}" --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare release APK
        run: cp app/build/outputs/apk/release/app-release.apk proxmox-mobile-manager.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" proxmox-mobile-manager.apk --title "Proxmox Mobile Manager $TAG_NAME" --generate-notes
