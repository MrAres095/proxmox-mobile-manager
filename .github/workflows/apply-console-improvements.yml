name: Apply console improvements

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/patch_console.py
      - name: Verify changed block
        run: grep -q 'Kopiraj sve' app/src/main/java/com/ares/proxmoxmobilemanager/MainActivity.kt
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ares/proxmoxmobilemanager/MainActivity.kt tools/patch_console.py .github/workflows/apply-console-improvements.yml
          git commit -m "Improve console copy and reconnect handling"
          git push origin HEAD:main
      - name: Remove one-time patch files
        run: |
          git rm tools/patch_console.py .github/workflows/apply-console-improvements.yml
          git commit -m "Remove one-time console patch workflow"
          git push origin HEAD:main
